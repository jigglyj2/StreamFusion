name: Flink SQL harness

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: flink-sql-harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flink-sql-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out StreamFusion
        uses: actions/checkout@v4

      - name: Set up Java 17 with Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Set up the Rust toolchain
        shell: bash
        run: |
          rust_version=$(mvn help:evaluate -Dexpression=rust.version -q -DforceStdout)
          rustup toolchain install "$rust_version" --profile minimal --component rustfmt
          rustup default "$rust_version"

      - name: Check out Apache Flink 2.3.0
        uses: actions/checkout@v4
        with:
          repository: apache/flink
          ref: release-2.3.0
          path: flink

      - name: Apply the StreamFusion planner patch
        working-directory: flink
        run: git apply --check ../dev/flink/2.3.0-planner-factory.patch && git apply ../dev/flink/2.3.0-planner-factory.patch

      - name: Install patched Flink planner artifacts
        working-directory: flink
        run: >-
          ./mvnw install -DskipTests -Dfast -Pskip-webui-build -T1C
          -pl flink-table/flink-table-api-java-uber,flink-table/flink-table-planner
          -am

      - name: Build native library for JVM tests
        shell: bash
        run: >-
          CARGO_TARGET_DIR="$PWD/streamfusion-native/target/rust"
          cargo build --manifest-path streamfusion-native/Cargo.toml --release --locked

      - name: Prepare Maven reactor artifacts
        run: >-
          mvn --batch-mode --update-snapshots --threads 1C
          -DskipTests -Dexec.skip=true install

      - name: Check Java formatting
        run: mvn --batch-mode --threads 1C -Dexec.skip=true spotless:check

      - name: Run Rust unit tests
        shell: bash
        run: >-
          CARGO_TARGET_DIR="$PWD/streamfusion-native/target/rust"
          cargo test --manifest-path streamfusion-native/Cargo.toml --locked

      - name: Run Java unit tests
        run: >-
          mvn --batch-mode --threads 1C -Dexec.skip=true
          -pl streamfusion-proto,streamfusion-native,streamfusion-flink,streamfusion-nexmark-benchmarks
          test

      - name: Run StreamFusion SQL parity harness
        timeout-minutes: 20
        run: >-
          mvn --batch-mode --threads 1C -Dexec.skip=true
          -pl streamfusion-flink-sql-tests -am test

      - name: Add StreamFusion to the upstream Flink SQL test classpath
        working-directory: flink
        run: >-
          git apply --check ../dev/flink/2.3.0-streamfusion-sql-suite.patch
          && git apply ../dev/flink/2.3.0-streamfusion-sql-suite.patch

      - name: Run Flink's streaming SQL suite on StreamFusion MiniClusters
        timeout-minutes: 60
        run: dev/integration/run-flink-sql-suite.sh "$PWD/flink"

      - name: Download the Flink runner distribution
        shell: bash
        run: |
          flink_version=$(mvn help:evaluate -Dexpression=flink.version -q -DforceStdout)
          curl --fail --location --silent --show-error \
            "https://archive.apache.org/dist/flink/flink-${flink_version}/flink-${flink_version}-bin-scala_2.12.tgz" \
            --output flink-runner.tgz
          tar -xzf flink-runner.tgz
          echo "FLINK_RUNNER_HOME=$PWD/flink-${flink_version}" >> "$GITHUB_ENV"

      - name: Submit a job with the installed StreamFusion JAR
        run: dev/integration/run-flink-runner-test.sh "$FLINK_RUNNER_HOME"
