syntax = "proto3";

package streamfusion.plan.v1;

option java_multiple_files = true;
option java_package = "tech.streamfusion.proto.plan.v1";

message NativePlan {
  uint32 protocol_version = 1;
  Operator root = 2;
}

message Operator {
  oneof operator {
    Input input = 1;
    Calc calc = 2;
  }
}

message Input {
  Schema schema = 1;
}

message Calc {
  Operator input = 1;
  repeated Expression projections = 2;
  optional Expression condition = 3;
}

message Expression {
  oneof expression {
    InputReference input_reference = 1;
    IntegerLiteral integer_literal = 2;
    GreaterThanOrEqual greater_than_or_equal = 3;
    Comparison comparison = 4;
    Arithmetic arithmetic = 5;
    NullCheck null_check = 6;
    BooleanBinary boolean_binary = 7;
    BooleanNot boolean_not = 8;
    LongLiteral long_literal = 9;
    ByteLiteral byte_literal = 10;
    ShortLiteral short_literal = 11;
    FloatLiteral float_literal = 12;
    DoubleLiteral double_literal = 13;
    DateLiteral date_literal = 14;
    TimeLiteral time_literal = 15;
    TimestampLiteral timestamp_literal = 16;
    DecimalLiteral decimal_literal = 17;
    BooleanLiteral boolean_literal = 18;
    StringLiteral string_literal = 19;
    BinaryLiteral binary_literal = 20;
    UnaryMinus unary_minus = 21;
    TruthTest truth_test = 22;
    Cast cast = 23;
    NullLiteral null_literal = 24;
    Coalesce coalesce = 25;
    Conditional conditional = 26;
    AbsoluteValue absolute_value = 27;
    Ceiling ceiling = 28;
    Floor floor = 29;
    Sign sign = 30;
    CharacterLength character_length = 31;
    Lower lower = 32;
    Upper upper = 33;
    Concat concat = 34;
    Like like = 35;
    StartsWith starts_with = 36;
    Substring substring = 37;
    StructField struct_field = 38;
    ArrayElement array_element = 39;
    MapElement map_element = 40;
    Cardinality cardinality = 41;
    ArrayContains array_contains = 42;
    ArrayReverse array_reverse = 43;
    ArrayAppend array_append = 44;
    ArrayPrepend array_prepend = 45;
    ArrayConcat array_concat = 46;
    ArrayPosition array_position = 47;
    ArrayDistinct array_distinct = 48;
    ArrayUnion array_union = 49;
    ArrayIntersect array_intersect = 50;
    ArrayConstructor array_constructor = 51;
    ArrayExcept array_except = 52;
    ArrayRemove array_remove = 53;
    ArrayMinimum array_minimum = 54;
    ArrayMaximum array_maximum = 55;
    ArrayJoin array_join = 56;
    Split split = 57;
    ArraySort array_sort = 58;
    ArraySlice array_slice = 59;
    RowConstructor row_constructor = 60;
    MapConstructor map_constructor = 61;
  }
}

message StructField {
  Expression operand = 1;
  string field_name = 2;
}

message ArrayElement {
  Expression array = 1;
  int64 index = 2;
}

message MapElement {
  Expression map = 1;
  Expression key = 2;
}

message Cardinality {
  Expression collection = 1;
}

message ArrayContains {
  Expression array = 1;
  Expression needle = 2;
}

message ArrayReverse {
  Expression array = 1;
}

message ArrayAppend {
  Expression array = 1;
  Expression element = 2;
}

message ArrayPrepend {
  Expression array = 1;
  Expression element = 2;
}

message ArrayConcat {
  repeated Expression arrays = 1;
}

message ArrayPosition {
  Expression array = 1;
  Expression needle = 2;
}

message ArrayDistinct {
  Expression array = 1;
}

message ArrayUnion {
  Expression left = 1;
  Expression right = 2;
}

message ArrayIntersect {
  Expression left = 1;
  Expression right = 2;
}

message ArrayConstructor {
  repeated Expression elements = 1;
}

message ArrayExcept {
  Expression left = 1;
  Expression right = 2;
}

message ArrayRemove {
  Expression array = 1;
  Expression needle = 2;
}

message ArrayMinimum {
  Expression array = 1;
}

message ArrayMaximum {
  Expression array = 1;
}

message ArrayJoin {
  Expression array = 1;
  Expression delimiter = 2;
  optional Expression null_replacement = 3;
}

message Split {
  Expression value = 1;
  Expression delimiter = 2;
}

message ArraySort {
  Expression array = 1;
  bool ascending = 2;
  bool null_first = 3;
}

message ArraySlice {
  Expression array = 1;
  int64 start = 2;
  optional int64 end = 3;
}

message RowConstructor {
  repeated string field_names = 1;
  repeated Expression fields = 2;
}

message MapConstructor {
  repeated Expression keys = 1;
  repeated Expression values = 2;
}

message Coalesce {
  repeated Expression arguments = 1;
}

message Conditional {
  repeated WhenThen branches = 1;
  Expression else_value = 2;
}

message WhenThen {
  Expression when = 1;
  Expression then = 2;
}

message AbsoluteValue {
  Expression operand = 1;
}

message Ceiling {
  Expression operand = 1;
}

message Floor {
  Expression operand = 1;
}

message Sign {
  Expression operand = 1;
}

message CharacterLength {
  Expression operand = 1;
}

message Lower {
  Expression operand = 1;
}

message Upper {
  Expression operand = 1;
}

message Concat {
  repeated Expression arguments = 1;
}

message Like {
  Expression operand = 1;
  string pattern = 2;
}

message StartsWith {
  Expression operand = 1;
  string prefix = 2;
}

message Substring {
  Expression operand = 1;
  int32 start = 2;
  optional int32 length = 3;
}

message NullLiteral {
  LogicalType type = 1;
}

message IntegerLiteral {
  int32 value = 1;
}

message LongLiteral {
  int64 value = 1;
}

message ByteLiteral {
  int32 value = 1;
}

message ShortLiteral {
  int32 value = 1;
}

message FloatLiteral {
  float value = 1;
}

message DoubleLiteral {
  double value = 1;
}

message DateLiteral {
  int32 epoch_day = 1;
}

message TimeLiteral {
  int32 millisecond_of_day = 1;
  uint32 precision = 2;
}

message TimestampLiteral {
  int64 epoch_millisecond = 1;
  int32 nano_of_millisecond = 2;
  uint32 precision = 3;
}

message DecimalLiteral {
  string unscaled_value = 1;
  uint32 precision = 2;
  int32 scale = 3;
}

message BooleanLiteral {
  bool value = 1;
}

message StringLiteral {
  string value = 1;
}

message BinaryLiteral {
  bytes value = 1;
  bool fixed_width = 2;
  uint32 length = 3;
}

message UnaryMinus {
  Expression operand = 1;
}

message TruthTest {
  Expression operand = 1;
  TruthTestOperator operator = 2;
}

message Cast {
  Expression operand = 1;
  LogicalType target_type = 2;
  CastKind kind = 3;
}

enum CastKind {
  CAST_KIND_UNSPECIFIED = 0;
  CAST_KIND_TINYINT_TO_SMALLINT = 1;
  CAST_KIND_TINYINT_TO_INTEGER = 2;
  CAST_KIND_TINYINT_TO_BIGINT = 3;
  CAST_KIND_SMALLINT_TO_INTEGER = 4;
  CAST_KIND_SMALLINT_TO_BIGINT = 5;
  CAST_KIND_INTEGER_TO_BIGINT = 6;
  CAST_KIND_TINYINT_TO_FLOAT = 7;
  CAST_KIND_TINYINT_TO_DOUBLE = 8;
  CAST_KIND_SMALLINT_TO_FLOAT = 9;
  CAST_KIND_SMALLINT_TO_DOUBLE = 10;
  CAST_KIND_INTEGER_TO_DOUBLE = 11;
  CAST_KIND_FLOAT_TO_DOUBLE = 12;
  CAST_KIND_INTEGER_TO_SMALLINT = 13;
  CAST_KIND_INTEGER_TO_TINYINT = 14;
  CAST_KIND_SMALLINT_TO_TINYINT = 15;
  CAST_KIND_BIGINT_TO_TINYINT = 16;
  CAST_KIND_BIGINT_TO_SMALLINT = 17;
  CAST_KIND_BIGINT_TO_INTEGER = 18;
  CAST_KIND_INTEGER_TO_FLOAT = 19;
  CAST_KIND_BIGINT_TO_FLOAT = 20;
  CAST_KIND_BIGINT_TO_DOUBLE = 21;
  CAST_KIND_DOUBLE_TO_FLOAT = 22;
}

enum TruthTestOperator {
  TRUTH_TEST_OPERATOR_UNSPECIFIED = 0;
  TRUTH_TEST_OPERATOR_IS_TRUE = 1;
  TRUTH_TEST_OPERATOR_IS_FALSE = 2;
  TRUTH_TEST_OPERATOR_IS_NOT_TRUE = 3;
  TRUTH_TEST_OPERATOR_IS_NOT_FALSE = 4;
}

message GreaterThanOrEqual {
  Expression left = 1;
  Expression right = 2;
}

message Comparison {
  Expression left = 1;
  Expression right = 2;
  ComparisonOperator operator = 3;
}

enum ComparisonOperator {
  COMPARISON_OPERATOR_UNSPECIFIED = 0;
  COMPARISON_OPERATOR_EQUAL = 1;
  COMPARISON_OPERATOR_NOT_EQUAL = 2;
  COMPARISON_OPERATOR_LESS_THAN = 3;
  COMPARISON_OPERATOR_LESS_THAN_OR_EQUAL = 4;
  COMPARISON_OPERATOR_GREATER_THAN = 5;
  COMPARISON_OPERATOR_GREATER_THAN_OR_EQUAL = 6;
  COMPARISON_OPERATOR_IS_DISTINCT_FROM = 7;
  COMPARISON_OPERATOR_IS_NOT_DISTINCT_FROM = 8;
}

message Arithmetic {
  Expression left = 1;
  Expression right = 2;
  ArithmeticOperator operator = 3;
}

enum ArithmeticOperator {
  ARITHMETIC_OPERATOR_UNSPECIFIED = 0;
  ARITHMETIC_OPERATOR_ADD = 1;
  ARITHMETIC_OPERATOR_SUBTRACT = 2;
  ARITHMETIC_OPERATOR_MULTIPLY = 3;
  ARITHMETIC_OPERATOR_DIVIDE = 4;
  ARITHMETIC_OPERATOR_MODULO = 5;
}

message NullCheck {
  Expression operand = 1;
  bool negated = 2;
}

message BooleanBinary {
  Expression left = 1;
  Expression right = 2;
  BooleanOperator operator = 3;
}

enum BooleanOperator {
  BOOLEAN_OPERATOR_UNSPECIFIED = 0;
  BOOLEAN_OPERATOR_AND = 1;
  BOOLEAN_OPERATOR_OR = 2;
}

message BooleanNot {
  Expression operand = 1;
}

message InputReference {
  uint32 index = 1;
  LogicalType type = 2;
}

message Schema {
  repeated Field fields = 1;
}

message Field {
  string name = 1;
  LogicalType type = 2;
}

message LogicalType {
  bool nullable = 1;
  oneof type {
    EmptyType integer = 2;
    EmptyType bigint = 3;
    EmptyType boolean = 4;
    EmptyType varchar = 5;
    EmptyType tinyint = 6;
    EmptyType smallint = 7;
    EmptyType float = 8;
    EmptyType double = 9;
    EmptyType binary = 10;
    EmptyType date = 11;
    PrecisionType time = 12;
    PrecisionType timestamp = 13;
    PrecisionType timestamp_ltz = 14;
    DecimalType decimal = 15;
    LengthType fixed_binary = 16;
    LengthType fixed_char = 17;
    CollectionType array = 18;
    MapType map = 19;
    RowType row = 20;
  }
}

message EmptyType {}

message PrecisionType {
  uint32 precision = 1;
}

message LengthType {
  uint32 length = 1;
}

message DecimalType {
  uint32 precision = 1;
  uint32 scale = 2;
}

message CollectionType {
  LogicalType element_type = 1;
}

message MapType {
  LogicalType key_type = 1;
  LogicalType value_type = 2;
}

message RowType {
  repeated RowField fields = 1;
}

message RowField {
  string name = 1;
  LogicalType type = 2;
}
