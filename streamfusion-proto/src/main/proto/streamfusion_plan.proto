    BooleanBinary boolean_binary = 7;
    BooleanNot boolean_not = 8;
    LongLiteral long_literal = 9;
    ByteLiteral byte_literal = 10;
    ShortLiteral short_literal = 11;
    FloatLiteral float_literal = 12;
    DoubleLiteral double_literal = 13;
    DateLiteral date_literal = 14;
    TimeLiteral time_literal = 15;
    TimestampLiteral timestamp_literal = 16;
    DecimalLiteral decimal_literal = 17;
    BooleanLiteral boolean_literal = 18;
    StringLiteral string_literal = 19;
    BinaryLiteral binary_literal = 20;
    UnaryMinus unary_minus = 21;
    TruthTest truth_test = 22;
    Cast cast = 23;
    NullLiteral null_literal = 24;
    Coalesce coalesce = 25;
    Conditional conditional = 26;
    AbsoluteValue absolute_value = 27;
    Ceiling ceiling = 28;
    Floor floor = 29;
    Sign sign = 30;
    CharacterLength character_length = 31;
    Lower lower = 32;
    Upper upper = 33;
    Concat concat = 34;
    Like like = 35;
    StartsWith starts_with = 36;
    Substring substring = 37;
    StructField struct_field = 38;
    ArrayElement array_element = 39;
    MapElement map_element = 40;
    Cardinality cardinality = 41;
    ArrayContains array_contains = 42;
    ArrayReverse array_reverse = 43;
    ArrayAppend array_append = 44;
    ArrayPrepend array_prepend = 45;
    ArrayConcat array_concat = 46;
    ArrayPosition array_position = 47;
    ArrayDistinct array_distinct = 48;
    ArrayUnion array_union = 49;
    ArrayIntersect array_intersect = 50;
    ArrayConstructor array_constructor = 51;
    ArrayExcept array_except = 52;
    ArrayRemove array_remove = 53;
    ArrayMinimum array_minimum = 54;
    ArrayMaximum array_maximum = 55;
    ArrayJoin array_join = 56;
    Split split = 57;
    ArraySort array_sort = 58;
    ArraySlice array_slice = 59;
    RowConstructor row_constructor = 60;
    MapConstructor map_constructor = 61;
    MapKeys map_keys = 62;
    MapValues map_values = 63;
    MapEntries map_entries = 64;
    StringReplace string_replace = 65;
    StringRepeat string_repeat = 66;
    StringEndsWith string_ends_with = 67;
    StringPosition string_position = 68;
    StringAscii string_ascii = 69;
    StringLeft string_left = 70;
    StringRight string_right = 71;
    SquareRoot square_root = 72;
    Exponential exponential = 73;
    Sine sine = 74;
    Cosine cosine = 75;
    Tangent tangent = 76;
    HyperbolicSine hyperbolic_sine = 77;
    HyperbolicTangent hyperbolic_tangent = 78;
    ArcSine arc_sine = 79;
    ArcCosine arc_cosine = 80;
    ArcTangent arc_tangent = 81;
    Degrees degrees = 82;
    Radians radians = 83;
    ArcTangent2 arc_tangent2 = 84;
    Cotangent cotangent = 85;
    NaturalLogarithm natural_logarithm = 86;
    CommonLogarithm common_logarithm = 87;
    ArbitraryLogarithm arbitrary_logarithm = 88;
    Power power = 89;
    Hexadecimal hexadecimal = 90;
    Base64Encode base64_encode = 91;
    Md5 md5 = 92;
    ShaDigest sha_digest = 93;
    Sha1 sha1 = 94;
    Sha2Dynamic sha2_dynamic = 95;
    CharacterFromCode chr = 96;
    StringReverse string_reverse = 97;
    StringInitCap string_init_cap = 98;
    StringTrim string_trim = 99;
    StringConcatWs string_concat_ws = 100;
    StringTranslate string_translate = 101;
    StringElt string_elt = 102;
    StringSplitIndex string_split_index = 103;
    BinaryString binary_string = 104;
    Unhex unhex = 105;
    UrlEncode url_encode = 106;
    UrlDecode url_decode = 107;
    JsonQuote json_quote = 108;
    StringHashCode string_hash_code = 109;
    NumericTruncate numeric_truncate = 110;
    TemporalExtract temporal_extract = 111;
    InetNtoa inet_ntoa = 112;
    InetAton inet_aton = 113;
    ScalarExtremum scalar_extremum = 114;
