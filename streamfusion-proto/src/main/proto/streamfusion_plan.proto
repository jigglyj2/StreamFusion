syntax = "proto3";

package streamfusion.plan.v1;

option java_multiple_files = true;
option java_package = "tech.streamfusion.proto.plan.v1";

message NativePlan {
  uint32 protocol_version = 1;
  Operator root = 2;
}

message NativeExchangePlan {
  uint32 protocol_version = 1;
  Schema schema = 2;
  ExchangeDistribution distribution = 3;
  repeated uint32 key_indices = 4;
  uint32 max_parallelism = 5;
  ExchangeTransport transport = 6;
  ExchangeMetadataColumns metadata_columns = 7;
  uint32 parallelism = 8;
  bool preserve_key_groups = 9;
}

message ExchangeMetadataColumns {
  uint32 row_kind_index = 1;
  optional uint32 stream_record_timestamp_index = 2;
  // Optional input-only BinaryRowData key sidecar. It is used for routing and is not transported.
  optional uint32 routing_key_index = 3;
}

enum ExchangeDistribution {
  EXCHANGE_DISTRIBUTION_UNSPECIFIED = 0;
  EXCHANGE_DISTRIBUTION_SINGLETON = 1;
  EXCHANGE_DISTRIBUTION_HASH = 2;
}

enum ExchangeTransport {
  EXCHANGE_TRANSPORT_UNSPECIFIED = 0;
  EXCHANGE_TRANSPORT_ARROW_C_STREAM = 1;
  EXCHANGE_TRANSPORT_ARROW_IPC_STREAM = 2;
}

message Operator {
  oneof operator {
    Input input = 1;
    Calc calc = 2;
    ArrayUnnest array_unnest = 3;
    Union union = 4;
    Expand expand = 5;
    Values values = 6;
    WindowTableFunction window_table_function = 7;
    Deduplicate deduplicate = 8;
    GroupAggregate group_aggregate = 9;
    WindowAggregate window_aggregate = 10;
    WindowDeduplicate window_deduplicate = 11;
    WindowRank window_rank = 12;
    WindowJoin window_join = 13;
    TopN top_n = 14;
    ChangelogNormalize changelog_normalize = 15;
    RegularJoin regular_join = 16;
    IntervalJoin interval_join = 17;
    OverAggregate over_aggregate = 18;
  }
}

// Streaming OVER aggregation. Each partition owns order-keyed Arrow rows and aggregate
// contributions in backend-neutral state. A present preceding_offset uses Flink's normalized
// representation: the retained row count (including the current row) for ROWS, and the inclusive
// time distance in milliseconds for RANGE.
message OverAggregate {
  Operator input = 1;
  repeated uint32 partition_key_indices = 2;
  uint32 order_key_index = 3;
  bool rows_frame = 4;
  optional uint64 preceding_offset = 5;
  OverTimeAttribute time_attribute = 6;
  repeated AggregateCall aggregate_calls = 7;
  Schema input_schema = 8;
  Schema output_schema = 9;
  bool input_changelog = 10;
  uint64 state_ttl_millis = 11;
  bool sort_ascending = 12;
  bool sort_nulls_last = 13;
}

enum OverTimeAttribute {
  OVER_TIME_ATTRIBUTE_UNSPECIFIED = 0;
  OVER_TIME_ATTRIBUTE_NON_TIME = 1;
  OVER_TIME_ATTRIBUTE_PROCESSING_TIME = 2;
  OVER_TIME_ATTRIBUTE_EVENT_TIME = 3;
}

// Time-bounded two-input streaming join. Each key owns timestamp-ordered Arrow-row multisets and
// one cleanup timer per input side. The timer/state encoding is backend-neutral so canonical
// savepoints can move between native memory and native RocksDB and can be repartitioned by Flink
// key group.
message IntervalJoin {
  repeated uint32 left_key_indices = 1;
  repeated uint32 right_key_indices = 2;
  repeated bool filter_nulls = 3;
  Schema left_schema = 4;
  Schema right_schema = 5;
  RegularJoinType join_type = 6;
  bool event_time = 7;
  int64 left_lower_bound_millis = 8;
  int64 left_upper_bound_millis = 9;
  uint32 left_time_index = 10;
  uint32 right_time_index = 11;
  uint64 allowed_lateness_millis = 12;
  uint64 min_cleanup_interval_millis = 13;
}

// Timer-free two-input regular streaming join. Both input sides are maintained as ordered
// schema-aware Arrow row multisets under the Flink join key. Association counts are part of the
// canonical state so outer, semi, and anti changelog transitions survive backend changes and
// rescaling exactly.
message RegularJoin {
  repeated uint32 left_key_indices = 1;
  repeated uint32 right_key_indices = 2;
  repeated bool filter_nulls = 3;
  Schema left_schema = 4;
  Schema right_schema = 5;
  RegularJoinType join_type = 6;
  uint64 left_state_ttl_millis = 7;
  uint64 right_state_ttl_millis = 8;
}

enum RegularJoinType {
  REGULAR_JOIN_TYPE_UNSPECIFIED = 0;
  REGULAR_JOIN_TYPE_INNER = 1;
  REGULAR_JOIN_TYPE_LEFT = 2;
  REGULAR_JOIN_TYPE_RIGHT = 3;
  REGULAR_JOIN_TYPE_FULL = 4;
  REGULAR_JOIN_TYPE_SEMI = 5;
  REGULAR_JOIN_TYPE_ANTI = 6;
}

// Timer-free streaming Top-N/ROW_NUMBER state. An empty ordering encodes only Flink's global
// constant LIMIT/OFFSET specialization; ordinary Top-N always has at least one sort key.
// The native operator consumes and emits Arrow,
// applies Flink ordering/changelog semantics, and owns key grouping, backend I/O, snapshots,
// and the canonical state encoding in one persistent execution handle.
message TopN {
  Operator input = 1;
  repeated uint32 partition_key_indices = 2;
  repeated uint32 sort_key_indices = 3;
  repeated uint32 primary_key_indices = 4;
  uint64 rank_start = 5;
  optional uint64 rank_end = 6;
  optional uint32 variable_rank_end_index = 7;
  bool output_rank_number = 8;
  bool generate_update_before = 9;
  TopNStrategy strategy = 10;
  Schema input_schema = 11;
  uint64 state_ttl_millis = 12;
  repeated bool sort_ascending = 13;
  repeated bool sort_nulls_last = 14;
  Schema output_schema = 15;
}

enum TopNStrategy {
  TOP_N_STRATEGY_UNSPECIFIED = 0;
  TOP_N_STRATEGY_APPEND_FAST = 1;
  TOP_N_STRATEGY_UPDATE_FAST = 2;
  TOP_N_STRATEGY_RETRACT = 3;
}

// Two-input event-time Window Join state. Rust stores schema-aware Arrow rows and emits a nullable
// Arrow candidate batch at timer firing. The Java control edge evaluates Flink's generated
// condition through zero-copy Arrow RowData views and gathers the final Arrow result once.
message WindowJoin {
  repeated uint32 left_key_indices = 1;
  repeated uint32 right_key_indices = 2;
  uint32 left_window_end_index = 3;
  uint32 right_window_end_index = 4;
  Schema left_schema = 5;
  Schema right_schema = 6;
  string shift_time_zone = 7;
}

// Timer-free keyed deduplication. The initial runtime supports insert-only rowtime input,
// keeps the greatest ordering value, and emits INSERT followed by UPDATE_AFTER changes.
message Deduplicate {
  Operator input = 1;
  repeated uint32 key_indices = 2;
  uint32 order_index = 3;
  bool keep_last = 4;
  bool generate_insert = 5;
  bool input_changelog = 6;
  bool generate_update_before = 7;
}

// Normalizes keyed upsert/changelog input to Flink's regular changelog contract. Values are
// schema-aware Arrow rows; RowKind, filter decisions, and triggering input ordinals are metadata.
message ChangelogNormalize {
  Operator input = 1;
  repeated uint32 key_indices = 2;
  bool generate_update_before = 3;
  Schema input_schema = 4;
  uint64 state_ttl_millis = 5;
  bool has_filter = 6;
}

// Timer-free unbounded keyed aggregation. State values are opaque, versioned accumulator bytes;
// grouping keys use Flink-compatible BinaryRow hashing and key-group assignment.
message GroupAggregate {
  Operator input = 1;
  repeated uint32 grouping_indices = 2;
  repeated AggregateCall aggregate_calls = 3;
  bool generate_update_before = 4;
  bool input_changelog = 5;
}

// Stateful SQL window aggregation. Grouping rows and accumulators are opaque native state;
// timers and state are partitioned with the same Flink key groups and snapshot envelope.
message WindowAggregate {
  Operator input = 1;
  repeated uint32 grouping_indices = 2;
  repeated AggregateCall aggregate_calls = 3;
  bool input_changelog = 4;
  uint32 time_attribute_index = 5;
  WindowKind kind = 6;
  int64 size_millis = 7;
  int64 slide_or_step_millis = 8;
  int64 offset_millis = 9;
  bool processing_time = 10;
  repeated WindowProperty window_properties = 11;
  Schema input_schema = 12;
  Schema output_schema = 13;
  string shift_time_zone = 14;
}

// Window-scoped first/last-row deduplication. Full rows use Arrow's schema-aware row encoding in
// canonical native state, so timer output is decoded directly to Arrow without a Java transpose.
message WindowDeduplicate {
  Operator input = 1;
  repeated uint32 partition_key_indices = 2;
  uint32 order_index = 3;
  uint32 window_end_index = 4;
  bool keep_last = 5;
  bool input_changelog = 6;
  Schema input_schema = 7;
  string shift_time_zone = 8;
}

// Window Top-N/ROW_NUMBER state. Rust stores schema-aware Arrow rows and applies this complete
// Flink sort contract before exporting selected rows directly as Arrow timer output.
message WindowRank {
  Operator input = 1;
  repeated uint32 partition_key_indices = 2;
  repeated uint32 sort_key_indices = 3;
  repeated bool sort_ascending = 4;
  repeated bool sort_nulls_last = 5;
  uint32 window_end_index = 6;
  uint64 rank_start = 7;
  uint64 rank_end = 8;
  bool output_rank_number = 9;
  bool input_changelog = 10;
  Schema input_schema = 11;
  string shift_time_zone = 12;
}

enum WindowProperty {
  WINDOW_PROPERTY_UNSPECIFIED = 0;
  WINDOW_PROPERTY_START = 1;
  WINDOW_PROPERTY_END = 2;
  WINDOW_PROPERTY_TIME = 3;
}

message AggregateCall {
  AggregateFunction function = 1;
  optional uint32 input_index = 2;
  LogicalType input_type = 3;
  LogicalType output_type = 4;
  bool retractable = 5;
}

enum AggregateFunction {
  AGGREGATE_FUNCTION_UNSPECIFIED = 0;
  AGGREGATE_FUNCTION_COUNT_STAR = 1;
  AGGREGATE_FUNCTION_COUNT = 2;
  AGGREGATE_FUNCTION_SUM = 3;
  AGGREGATE_FUNCTION_MIN = 4;
  AGGREGATE_FUNCTION_MAX = 5;
}

message WindowTableFunction {
  Operator input = 1;
  uint32 time_attribute_index = 2;
  WindowKind kind = 3;
  int64 size_millis = 4;
  int64 slide_or_step_millis = 5;
  int64 offset_millis = 6;
  // SESSION TVFs use schema-aware Arrow-row keyed state and native Arrow timer output; aligned
  // windows leave these fields empty.
  repeated uint32 partition_key_indices = 7;
  bool processing_time = 8;
  Schema input_schema = 9;
  string shift_time_zone = 10;
}

enum WindowKind {
  WINDOW_KIND_UNSPECIFIED = 0;
  WINDOW_KIND_TUMBLE = 1;
  WINDOW_KIND_HOP = 2;
  WINDOW_KIND_CUMULATE = 3;
  WINDOW_KIND_SESSION = 4;
}

message Input {
  Schema schema = 1;
  uint32 input_index = 2;
}

message Union {
  repeated Operator inputs = 1;
}

message Expand {
  Operator input = 1;
  repeated ExpandProjection projections = 2;
}

message ExpandProjection {
  repeated Expression expressions = 1;
}

message Values {
  Schema schema = 1;
  repeated ValuesRow rows = 2;
}

message ValuesRow {
  repeated Expression values = 1;
}

message Calc {
  Operator input = 1;
  repeated Expression projections = 2;
  optional Expression condition = 3;
}

message ArrayUnnest {
  Operator input = 1;
  uint32 array_index = 2;
  bool with_ordinality = 3;
  bool preserve_empty = 4;
  UnnestCollection collection = 5;
  optional Expression collection_expression = 6;
}

enum UnnestCollection {
  UNNEST_COLLECTION_ARRAY = 0;
  UNNEST_COLLECTION_MAP = 1;
  UNNEST_COLLECTION_MULTISET = 2;
}

