}

message Cast {
  Expression operand = 1;
  LogicalType target_type = 2;
  CastKind kind = 3;
}

enum CastKind {
  CAST_KIND_UNSPECIFIED = 0;
  CAST_KIND_TINYINT_TO_SMALLINT = 1;
  CAST_KIND_TINYINT_TO_INTEGER = 2;
  CAST_KIND_TINYINT_TO_BIGINT = 3;
  CAST_KIND_SMALLINT_TO_INTEGER = 4;
  CAST_KIND_SMALLINT_TO_BIGINT = 5;
  CAST_KIND_INTEGER_TO_BIGINT = 6;
  CAST_KIND_TINYINT_TO_FLOAT = 7;
  CAST_KIND_TINYINT_TO_DOUBLE = 8;
  CAST_KIND_SMALLINT_TO_FLOAT = 9;
  CAST_KIND_SMALLINT_TO_DOUBLE = 10;
  CAST_KIND_INTEGER_TO_DOUBLE = 11;
  CAST_KIND_FLOAT_TO_DOUBLE = 12;
  CAST_KIND_INTEGER_TO_SMALLINT = 13;
  CAST_KIND_INTEGER_TO_TINYINT = 14;
  CAST_KIND_SMALLINT_TO_TINYINT = 15;
  CAST_KIND_BIGINT_TO_TINYINT = 16;
  CAST_KIND_BIGINT_TO_SMALLINT = 17;
  CAST_KIND_BIGINT_TO_INTEGER = 18;
  CAST_KIND_INTEGER_TO_FLOAT = 19;
  CAST_KIND_BIGINT_TO_FLOAT = 20;
  CAST_KIND_BIGINT_TO_DOUBLE = 21;
  CAST_KIND_DOUBLE_TO_FLOAT = 22;
}

enum TruthTestOperator {
  TRUTH_TEST_OPERATOR_UNSPECIFIED = 0;
  TRUTH_TEST_OPERATOR_IS_TRUE = 1;
  TRUTH_TEST_OPERATOR_IS_FALSE = 2;
  TRUTH_TEST_OPERATOR_IS_NOT_TRUE = 3;
  TRUTH_TEST_OPERATOR_IS_NOT_FALSE = 4;
}

message GreaterThanOrEqual {
  Expression left = 1;
  Expression right = 2;
}

message Comparison {
  Expression left = 1;
  Expression right = 2;
  ComparisonOperator operator = 3;
}

enum ComparisonOperator {
  COMPARISON_OPERATOR_UNSPECIFIED = 0;
  COMPARISON_OPERATOR_EQUAL = 1;
  COMPARISON_OPERATOR_NOT_EQUAL = 2;
  COMPARISON_OPERATOR_LESS_THAN = 3;
  COMPARISON_OPERATOR_LESS_THAN_OR_EQUAL = 4;
  COMPARISON_OPERATOR_GREATER_THAN = 5;
  COMPARISON_OPERATOR_GREATER_THAN_OR_EQUAL = 6;
  COMPARISON_OPERATOR_IS_DISTINCT_FROM = 7;
  COMPARISON_OPERATOR_IS_NOT_DISTINCT_FROM = 8;
}

message Arithmetic {
  Expression left = 1;
  Expression right = 2;
  ArithmeticOperator operator = 3;
  // Exact result type selected by Flink for decimal arithmetic. When present,
  // native execution applies Flink's integral-to-decimal coercion before the
  // operation and normalizes the result to this precision and scale.
  LogicalType result_type = 4;
}

enum ArithmeticOperator {
  ARITHMETIC_OPERATOR_UNSPECIFIED = 0;
  ARITHMETIC_OPERATOR_ADD = 1;
  ARITHMETIC_OPERATOR_SUBTRACT = 2;
  ARITHMETIC_OPERATOR_MULTIPLY = 3;
  ARITHMETIC_OPERATOR_DIVIDE = 4;
  ARITHMETIC_OPERATOR_MODULO = 5;
}

message NullCheck {
  Expression operand = 1;
  bool negated = 2;
}

message BooleanBinary {
  Expression left = 1;
  Expression right = 2;
  BooleanOperator operator = 3;
}

enum BooleanOperator {
  BOOLEAN_OPERATOR_UNSPECIFIED = 0;
  BOOLEAN_OPERATOR_AND = 1;
  BOOLEAN_OPERATOR_OR = 2;
}

message BooleanNot {
  Expression operand = 1;
}

message InputReference {
  uint32 index = 1;
  LogicalType type = 2;
}

message Schema {
  repeated Field fields = 1;
}

message Field {
  string name = 1;
  LogicalType type = 2;
}

message LogicalType {
  bool nullable = 1;
  oneof type {
    EmptyType integer = 2;
    EmptyType bigint = 3;
    EmptyType boolean = 4;
    EmptyType varchar = 5;
    EmptyType tinyint = 6;
    EmptyType smallint = 7;
    EmptyType float = 8;
    EmptyType double = 9;
    EmptyType binary = 10;
    EmptyType date = 11;
    PrecisionType time = 12;
    PrecisionType timestamp = 13;
    PrecisionType timestamp_ltz = 14;
    DecimalType decimal = 15;
    LengthType fixed_binary = 16;
    LengthType fixed_char = 17;
    CollectionType array = 18;
    MapType map = 19;
    RowType row = 20;
  }
}

message EmptyType {}

message PrecisionType {
  uint32 precision = 1;
}

message LengthType {
  uint32 length = 1;
}

message DecimalType {
  uint32 precision = 1;
  uint32 scale = 2;
}

message CollectionType {
  LogicalType element_type = 1;
}

message MapType {
  LogicalType key_type = 1;
  LogicalType value_type = 2;
}

message RowType {
  repeated RowField fields = 1;
}

message RowField {
  string name = 1;
  LogicalType type = 2;
}
