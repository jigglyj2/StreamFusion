syntax = "proto3";

package streamfusion.plan.v1;
option java_multiple_files = true;
option java_package = "tech.streamfusion.proto.plan.v1";

// Task-local resources chosen by Flink, separate from the physical SQL plan. These are
// execution bindings, never a deployment-time StreamFusion memory configuration.
message NativeStateBindings {
  uint32 protocol_version = 1;
  repeated NativeStateBinding bindings = 2;
  // Protocol 4: task-local directories assigned by Flink's IOManager, shared by native owners.
  repeated string spill_directories = 3;
}

message NativeStateBinding {
  uint64 plan_node_id = 1;
  uint32 max_parallelism = 2;
  uint32 first_key_group = 3;
  uint32 last_key_group = 4;
  oneof backend {
    NativeMemoryState memory = 5;
    NativeRocksDbState rocksdb = 6;
  }
  // Protocol 3: Flink's restored union-operator watermark for a slicing window.
  // This clock is independent of keyed state and must be supplied before keyed restore.
  optional int64 restored_watermark = 7;
}

message NativeMemoryState {}

// Names/types/scopes are negotiated once; each gauge snapshot is a packed long[] in this order.
// INT32 is sign-extended, INT64 is unchanged, FLOAT64 carries raw IEEE-754 bits.
// Version 2 extends this existing scalar channel with typed counters and clock-based gauges.
// Version 1 remains gauge-only; no extra per-stage JNI reads are required.
message NativeGaugeSchema {
  uint32 protocol_version = 1;
  repeated NativeGaugeDescriptor gauges = 2;
}

message NativeGaugeDescriptor {
  uint64 plan_node_id = 1;
  repeated string groups = 2;
  string name = 3;
  NativeGaugeValueKind value_kind = 4;
  NativeMetricKind metric_kind = 5;
  // COUNTER only: register Flink MeterView over this same counter, using its default interval.
  string meter_name = 6;
}

enum NativeMetricKind {
  NATIVE_METRIC_KIND_GAUGE = 0;
  NATIVE_METRIC_KIND_COUNTER = 1;
  // Snapshot is the native event-time watermark; Java reads Flink's processing clock on demand.
  NATIVE_METRIC_KIND_WATERMARK_LATENCY = 2;
}

enum NativeGaugeValueKind {
  NATIVE_GAUGE_VALUE_KIND_UNSPECIFIED = 0;
  NATIVE_GAUGE_VALUE_KIND_INT32 = 1;
  NATIVE_GAUGE_VALUE_KIND_INT64 = 2;
  NATIVE_GAUGE_VALUE_KIND_FLOAT64 = 3;
}

// Flink-owned, coalesced physical-stage control events for one native-tree invocation.
// The data inputs of this invocation must be typed empty Arrow batches.
message NativeControlInvocation {
  uint32 protocol_version = 1;
  repeated NativeStageControl stages = 2;
}

message NativeStageControl {
  uint64 plan_node_id = 1;
  oneof event {
    int64 watermark_millis = 2;
    uint64 before_checkpoint = 3;
    NativeControlEndInput end_input = 4;
    // Control protocol 2: a Flink-owned processing-time timer firing, independent of watermarks.
    int64 processing_time_millis = 5;
  }
}

message NativeControlEndInput {}

// Discovered once after binding state, not an operator-family list in the JVM driver.
message NativeControlCapabilities {
  uint32 protocol_version = 1;
  repeated NativeStageControlCapability stages = 2;
}

message NativeStageControlCapability {
  uint64 plan_node_id = 1;
  bool watermark = 2;
  bool before_checkpoint = 3;
  bool end_input = 4;
  // Capability protocol 2 or later. Version 1 readers must never silently ignore this requirement.
  bool processing_time = 5;
  // Capability protocol 3: external Arrow input whose per-record clock vector this stage consumes.
  // The owner must directly consume this edge; this is separate from the SQL PROCTIME placeholder.
  optional uint32 processing_time_input_port = 6;
}

message NativeRocksDbState {
  string plugin_path = 1;
  string database_path = 2;
  // The existing Flink-managed STATE_BACKEND/OPERATOR lease, not an extra budget.
  uint64 memory_limit = 3;
  // State-binding protocol v2: Flink's TaskManager-resolved automatic log relocation.
  // Logs here are cleaned on close. Explicit user directories use NativeRocksDbOptions.
  optional string log_directory = 4;
  // State-binding protocol v5: resolved Flink shared-cache geometry.
  optional double write_buffer_ratio = 5;
  optional double high_priority_pool_ratio = 6;
  // Protocol 6: resolved Flink database and table options.
  NativeRocksDbOptions database_options = 7;
  // Protocol 8: flag resolved by the first owner of Flink's shared memory resource.
  optional bool partitioned_index_filters = 8;
  // Protocol 11: selected database ticker codes from state ABI 18; empty disables statistics.
  repeated uint32 statistics_tickers = 9;
}

// Task-lifetime buffer resources resolved by Flink before keyed factories or native lowering.
// Protocol 1 binds local-window buffers; protocol 2 also binds processing-time window buffers.
message NativeTaskBindings {
  uint32 protocol_version = 1;
  repeated NativeTaskBinding bindings = 2;
}

message NativeTaskBinding {
  uint64 plan_node_id = 1;
  oneof resource {
    NativeLocalWindowBuffer local_window_buffer = 2;
  }
}

message NativeLocalWindowBuffer {
  // Original physical Flink operator's resolved OPERATOR share; determines semantic flush
  // boundaries only. Actual native allocations still consume the existing host memory pool.
  uint64 flink_buffer_memory_bytes = 1;
  uint32 flink_page_bytes = 2;
}

// Complete resolved settings; an absent message retains legacy Flink defaults.
message NativeRocksDbOptions {
  int32 max_background_jobs = 1;
  int32 max_open_files = 2;
  uint64 max_log_file_size = 3;
  uint64 keep_log_file_num = 4;
  bool dynamic_level_bytes = 5;
  uint64 target_file_size_base = 6;
  uint64 max_bytes_for_level_base = 7;
  uint64 write_buffer_size = 8;
  int32 max_write_buffer_number = 9;
  int32 min_write_buffer_number_to_merge = 10;
  uint64 periodic_compaction_seconds = 11;
  uint64 block_size = 12;
  uint64 metadata_block_size = 13;
  // Protocol 7: absent fields retain the previous defaults.
  optional uint32 log_level = 14;
  NativeRocksDbBloomFilter bloom_filter = 15;
  NativeRocksDbCompression compression = 16;
  // Protocol 8: 0=level, 1=universal, 3=no background compaction. FIFO(2) is not admitted.
  optional uint32 compaction_style = 17;
  // Protocol 9: explicit Flink log directory. Logs here remain user-owned on close.
  // Absent: retain the TaskManager-resolved automatic relocation in NativeRocksDbState.
  optional string log_directory = 18;
  // Protocol 10: bulk write threshold in bytes; zero disables only the byte threshold.
  optional uint64 write_batch_size = 19;
}

message NativeRocksDbBloomFilter {
  bool enabled = 1;
  double bits_per_key = 2;
  bool block_based_mode = 3;
}

message NativeRocksDbCompression {
  // Explicit codes: none=0, Snappy=1, Zlib=2, BZip2=3, LZ4=4, LZ4HC=5, ZSTD=7.
  // Unknown codes are rejected. An empty list uses RocksDB's
  // configured base compression (Snappy), matching Flink's empty per-level list.
  repeated int32 per_level = 1;
}
