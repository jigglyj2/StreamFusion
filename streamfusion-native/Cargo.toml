[package]
name = "streamfusion-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
arrow = { version = "59.2.0", features = ["ffi"] }
datafusion = { version = "55.0.0", default-features = false }
datafusion-functions = { version = "55.0.0", default-features = false, features = ["crypto_expressions", "math_expressions", "string_expressions", "unicode_expressions"] }
datafusion-functions-nested = { version = "55.0.0", default-features = false }
jni = "0.22.4"
prost = "0.14.4"
sha1 = "0.10.6"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt", "rt-multi-thread"] }

[build-dependencies]
prost-build = "0.14.4"
protoc-bin-vendored = "3.2.0"
