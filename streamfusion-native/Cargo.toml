[package]
name = "streamfusion-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ahash = "0.8.12"
arrow = { version = "59.2.0", features = ["ffi"] }
arrow-row = "59.2.0"
chrono = "0.4.42"
chrono-tz = "0.10.4"
datafusion = { version = "55.0.0", default-features = false }
datafusion-functions = { version = "55.0.0", default-features = false, features = ["crypto_expressions", "datetime_expressions", "math_expressions", "string_expressions", "unicode_expressions"] }
datafusion-functions-nested = { version = "55.0.0", default-features = false }
futures = "0.3.31"
hashbrown = "0.17.1"
jni = "0.22.4"
libloading = "0.9.0"
num-bigint = "0.5.1"
num-traits = "0.2.19"
prost = "0.14.4"
sha1 = "0.10.6"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt"] }
streamfusion-state-abi = { path = "../streamfusion-state-abi" }

[dev-dependencies]
tempfile = "3.23.0"
tokio = { version = "1.53.1", features = ["macros", "rt", "rt-multi-thread"] }

[build-dependencies]
prost-build = "0.14.4"
protoc-bin-vendored = "3.2.0"
